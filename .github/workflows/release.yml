name: release

# Build the self-contained Windows exe and publish a GitHub release whenever a
# version tag (v*) is pushed:   git tag v0.2.0 && git push origin v0.2.0
on:
  push:
    tags: ['v*']
  workflow_dispatch: {}   # also runnable manually from the Actions tab

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Build + self-sign the TTS capture shim fresh from source so the published exe always embeds a
      # current, signed saapi64.dll (the App .csproj embeds dll/saapi64.dll + dll/d4scanner-tts.cer).
      - name: Build + sign capture shim (saapi64.dll)
        shell: pwsh
        run: |
          # A self-signed signature reads as "untrusted" on the runner — that's expected; the app trusts the
          # embedded .cer at install time. We just need the dll signed with the cert whose public key is exported.
          $ok = $false
          try {
            $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
            $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
            if (-not $vs) { throw 'no MSVC C++ tools on runner' }
            $devcmd = Join-Path $vs 'Common7\Tools\VsDevCmd.bat'
            Push-Location dll
            try {
              cmd /c "call `"$devcmd`" -arch=x64 -host_arch=x64 >nul 2>&1 && cl /nologo /O2 /EHsc /LD /DUNICODE /D_UNICODE saapi64.cpp /Fe:saapi64.dll"
              if (-not (Test-Path saapi64.dll)) { throw 'cl produced no dll' }
              $cert = New-SelfSignedCertificate -Type CodeSigning -Subject 'CN=D4Scanner TTS Shim' `
                -CertStoreLocation Cert:\CurrentUser\My -NotAfter (Get-Date).AddYears(5)
              Export-Certificate -Cert $cert -FilePath d4scanner-tts.cer | Out-Null
              Set-AuthenticodeSignature -FilePath saapi64.dll -Certificate $cert -HashAlgorithm SHA256 | Out-Null
              $ok = $true
            } finally { Pop-Location }
            Write-Host 'Built + signed saapi64.dll fresh from source.'
          } catch {
            Write-Host "::warning::Shim rebuild failed ($_) — using the committed prebuilt dll/cert."
          }
          if (-not $ok) { git checkout -- dll/saapi64.dll dll/d4scanner-tts.cer }
          if (-not (Test-Path dll/saapi64.dll)) { throw 'no saapi64.dll available to embed' }
          exit 0

      - name: Publish single-file self-contained exe
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not $tag.StartsWith('v')) { $tag = 'dev' }   # workflow_dispatch has no tag
          # Embed the version in the assembly so the auto-updater can compare it at runtime
          $ver = $tag.TrimStart('v')
          if ($ver -notmatch '^\d') { $ver = '0.0.0' }
          dotnet publish csharp/D4Scanner.App -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true -p:Version=$ver -o publish
          Copy-Item publish/D4Scanner.exe "D4Scanner-$tag-win-x64.exe"

      # Optional Authenticode signing — only runs if a CODESIGN_PFX_BASE64 secret is set.
      - name: Sign (optional)
        if: ${{ env.CODESIGN_PFX_BASE64 != '' }}
        shell: pwsh
        env:
          CODESIGN_PFX_BASE64: ${{ secrets.CODESIGN_PFX_BASE64 }}
          CODESIGN_PFX_PASSWORD: ${{ secrets.CODESIGN_PFX_PASSWORD }}
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\cs.pfx", [Convert]::FromBase64String($env:CODESIGN_PFX_BASE64))
          & "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" sign `
            /f "$env:RUNNER_TEMP\cs.pfx" /p $env:CODESIGN_PFX_PASSWORD /fd SHA256 `
            /tr http://timestamp.digicert.com /td SHA256 (Get-Item D4Scanner-*-win-x64.exe).FullName

      # The exe is fully self-contained: the capture shim (saapi64.dll) + its certificate are embedded and
      # installed by the in-app button, so the ONLY asset a user needs is the .exe — ship just that.
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            D4Scanner-*-win-x64.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
